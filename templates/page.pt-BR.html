<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} — GtW</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#0e3a22">
  <link rel="icon" href="/assets/img/icon-64.png">
  <link rel="apple-touch-icon" href="/assets/img/icon-180.png">
  <link rel="preload" href="/assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="alternate" hreflang="en" href="https://gtw.livehardr.com/{{name}}">
  <link rel="alternate" hreflang="pt-BR" href="https://gtw.livehardr.com/pt/{{name}}">
</head>
<body class="page">
  <header class="top">
    <div class="wrap">
      <a class="brand" href="/pt/"><img src="/assets/img/icon-64.png" alt="" width="40" height="40"><span>GtW</span></a>
      <nav aria-label="Site">
        <a href="/pt/support">Suporte</a>
        <a href="/pt/privacy">Privacidade</a>
        <a href="/{{name}}" hreflang="en" lang="en">English</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <article class="prose">
{{content}}
    </article>
  </main>
  <footer class="foot">
    <div class="wrap">
      <div class="links">
        <a href="/pt/support">Suporte</a>
        <a href="/pt/privacy">Política de privacidade</a>
        <a href="mailto:gtw@livehardr.com">gtw@livehardr.com</a>
      </div>
      <small>Apple, Apple Watch, Saúde e anéis de Atividade são marcas registradas da Apple Inc. O GtW é um app independente, sem vínculo com a Apple e sem endosso dela.</small>

</body>
</html>
